[workspace]
resolver = "3"

members = ["crates/*"]

default-members = ["crates/sga-archiver-cli"]

[workspace.package]
version = "0.2.0"
authors = ["Bjorn Beishline"]
license = "MIT"
edition = "2024"
repository = "https://github.com/BjornTheProgrammer/sga-archiver"

[workspace.dependencies]
anyhow = "1.0"
byteorder = "1"
thiserror = "2"
flate2 = "1.0"
brotli = "7.0.0"
clap = { version = "4.5.35", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.41"
png = "0.17"
intel_tex_2 = "0.5"
csv = "1"
